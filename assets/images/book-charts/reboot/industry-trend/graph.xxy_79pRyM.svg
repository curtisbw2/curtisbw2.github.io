<svg viewBox="0 0 697 691" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Growth of R&amp;D Spending by Industry (1945–2020)</title>
<desc>This chart tracks research and development (R&amp;D) spending across major industries from 1945 to 2020, measured in billions of dollars. While aerospace and defense (7) dominated early on, sectors like software/internet (3) and healthcare (1) surged in later decades. Notably, software/internet (dotted line) shows the steepest growth, surpassing many traditional sectors by 2020. Meanwhile, computing/electronics (2) and auto (4) saw steadier or declining relative investments. This reflects a broader economic shift toward digital innovation and biotechnology over industrial manufacturing.</desc>
