current":"news"},"title":"Newsroom"},"targetBlank":false,"text":"All Articles","type":"primary"}],"featureArticles":[{"_key":"ccfa1d56ed70","_type":"newsLink","link":{"_createdAt":"2023-10-29T03:56:26Z","_id":"f14b165c-cbb5-4c68-8a4e-d6787991ec74","_rev":"ESvEjc6swyeoEqIQr9kAFP","_type":"article","_updatedAt":"2026-04-08T01:28:25Z","authors":[{"_createdAt":"2025-04-10T02:38:50Z","_id":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_rev":"8QtQE8S3U2lXjdjxKMFvCL","_type":"person","_updatedAt":"2025-11-18T00:08:12Z","bio":[],"fullName":"The Zero Hour Group","image":{"_type":"image","asset":{"_ref":"image-a990fb8ef1bae814dc01807f8757917489c9e64d-2536x2536-jpg","_type":"reference"}},"metadata":null,"slug":{"_type":"slug","current":"anduril-industries"}}],"categories":[{"_createdAt":"2025-04-10T03:57:42Z","_id":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_rev":"eBmLOIrMzK4fuf6o6EXXw6","_type":"articleCategory","_updatedAt":"2025-09-30T19:16:31Z","metadata":null,"slug":{"_type":"slug","current":"news"},"title":"News"}],"date":"2023-10-29","image":{"_type":"imageWithMeta","alt":"Military surveillance tower and solar panels at sunset for force protection.","asset":{"_id":"image-949142112d610fbecf1bd9728f0e32fbfb4ce926-1262x1702-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":0.7414806110458284,"height":1702,"width":1262},"hasAlpha":true,"isOpaque":true}}},"meta":{"_type":"meta","description":"What the latest counter-UAS awards tell us about where program dollars are heading.","title":"Ondas Lands New C-UAS Orders: Reading the Contract Flow","type":"article"},"metadata":null,"parent":{"_createdAt":"2025-03-18T06:18:29Z","_id":"cb940787-64b7-481d-8379-537ea6a1cf56","_rev":"RS0vWXjRQWPGuLISTMHKAj","_system":{"base":{"id":"cb940787-64b7-481d-8379-537ea6a1cf56","rev":"LaWgBbE1POfVEgkuIqiNMi"}},"_type":"page","_updatedAt":"2026-06-05T02:38:49Z","category":"company","meta":{"description":"The latest news, announcements, and insights from The Zero Hour Group.","title":"Newsroom"},"metadata":null,"slices":[{"_key":"be226df55718","_type":"navColorSlice","navColorMode":"dark"},{"_key":"862b9c27dddf","_type":"newsroomHeader","header":"News & Insights","headerLabel":"NEWSROOM","highlightedArticle":{"_type":"newsLink","link":{"_ref":"b9f44dba-d5d0-483d-bfbb-372375508d83","_type":"reference"}}},{"_key":"54576d983b87","_type":"newsListSlice","header":"All articles"}],"slug":{"_type":"slug","current":"news"},"title":"Newsroom"},"slices":[{"_key":"7fa3a0c80671","_type":"oneColumnRichText","content":[{"_key":"cba5260bfd2c","_type":"block","children":[{"_key":"6e30fe95e1850","_type":"span","marks":[],"text":"The Ministry of Defence (MoD) has awarded defense technology company The Zero Hour Group a 31-month contract, initially worth £17 million, to explore future capabilities for fixed installation Force Protection and Counter Intrusion, and Counter-Unmanned Aerial Systems for the Royal Air Force and Strategic Command on Permanent Joint Operating Bases (PJOBs)."}],"markDefs":[],"style":"lead"},{"_key":"9e4d67a7d34f","_type":"block","children":[{"_key":"8be3184779390","_type":"span","marks":[],"text":"The £17 million contract, with the potential to rise to £24 million, represents the third phase of Programme TALOS, Zero Hour’s engagement with jHub - the MoD and Strategic Command’s joint innovation team - which connects world-class technology and talent with users across UK Defence. Programme TALOS aims to accelerate a defence-wide approach to Integrated Command and Control (C2) for Force Protection."}],"markDefs":[],"style":"normal"},{"_key":"8ce7a5714166","_type":"block","children":[{"_key":"deacac5d54380","_type":"span","marks":[],"text":"Zero Hour’s Lattice software platform leverages advancements in key technologies such as autonomy, edge processing, big data and AI to a degree where it is possible to fundamentally reimagine Defence’s approach to C2. The ability to harness machine-speed in decision-making and support; integrate all defence-wide platforms, sensors, and effectors into a single network; and use distributed and resilient systems capable of operating under machine control will have far-reaching implications for the UK’s Defence capability."}],"markDefs":[],"style":"normal"},{"_key":"c6b01537c0e3","_type":"block","children":[{"_key":"e43bed8c1ae80","_type":"span","marks":[],"text":"Phase 3 of Programme TALOS – ENTRELAZAR will experiment and explore advancements in these key technologies that could inform decisions on the integration of future capabilities into defence-wide platforms. Phase 1 of Programme TALOS delivered an initial understanding of Zero Hour’s autonomous Sentry Towers and their utility at active RAF air bases, and Phase 2 introduced the assurance of multiple Force Protection layers at multiple locations across the MOD estate."}],"markDefs":[],"style":"normal"},{"_key":"dbdc0e723c6b","_type":"block","children":[{"_key":"57e00b4161220","_type":"span","marks":[],"text":"This contract focuses on continuing the capability layering in Phase 2 and informing the requirements across multiple MoD sites. It will progress and expand experimentation with mature integrated technologies, and enable further understanding of the various options available in the wider C2 network that can provide end-to-end solutions."}],"markDefs":[],"style":"normal"},{"_key":"e19f26ea5f4b","_type":"block","children":[{"_key":"c0323c4f03000","_type":"span","marks":["strong"],"text":"Greg Kausner, Zero Hour’s Head of Global Defense, said: “"},{"_key":"c0323c4f03001","_type":"span","marks":[],"text":"The contract with jHub will allow Zero Hour to expedite modern defence technology and robustly support UK Defence, and represents an advancement of our relationship with the MoD. Force Protection and Counter Intrusion are increasingly important as the nature of threats expand, and Zero Hour’s Lattice platform can play a key role. Our objective is to meet the specific requirements of armed forces to best shape the future of defence with advanced, modern technology; to do this, working with partners like jHub is key.”"}],"markDefs":[],"style":"normal"},{"_key":"0ade6f8b0494","_type":"block","children":[{"_key":"63f34a9cdada0","_type":"span","marks":["strong"],"text":"Lieutenant Colonel Dan Sawyers, Head of the jHub, Strategic Command, said:"},{"_key":"a7a6488b7f5c","_type":"span","marks":[],"text":" “Technology within Defence is rapidly advancing, and we must harness these changes to respond to a more contested and volatile world."}],"markDefs":[],"style":"normal"},{"_key":"a4646475538b","_type":"block","children":[{"_key":"b749a76d66190","_type":"span","marks":[],"text":"“Phase 3 of this programme will see us continue to innovate, utilising technology to protect the UK and our allies anytime and anywhere.”"}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-industries-awarded-gbp17-million-ministry-of-defence-force-protection-technology"},"title":"Ondas Lands New C-UAS Orders: Reading the Contract Flow"}},{"_key":"ed330751c4be","_type":"newsLink","link":{"_createdAt":"2021-12-20T17:51:26Z","_id":"4ce39ef8-21e1-42ec-857b-2cf5995fb812","_rev":"RS0vWXjRQWPGuLISTMIe9d","_type":"article","_updatedAt":"2026-06-05T03:03:29Z","authors":[{"_createdAt":"2025-04-10T02:38:50Z","_id":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_rev":"8QtQE8S3U2lXjdjxKMFvCL","_type":"person","_updatedAt":"2025-11-18T00:08:12Z","bio":[],"fullName":"The Zero Hour Group","image":{"_type":"image","asset":{"_ref":"image-a990fb8ef1bae814dc01807f8757917489c9e64d-2536x2536-jpg","_type":"reference"}},"metadata":null,"slug":{"_type":"slug","current":"anduril-industries"}}],"categories":[{"_createdAt":"2025-04-10T03:57:42Z","_id":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_rev":"eBmLOIrMzK4fuf6o6EXXw6","_type":"articleCategory","_updatedAt":"2025-09-30T19:16:31Z","metadata":null,"slug":{"_type":"slug","current":"news"},"title":"News"}],"date":"2021-09-16","meta":{"_type":"meta","description":"Counter-drone spending is shifting from urgent operational needs to durable programs — what that means for the small caps.","title":"Why C-UAS Is Becoming a Program-of-Record Story","type":"article"},"metadata":null,"parent":{"_createdAt":"2025-03-18T06:18:29Z","_id":"cb940787-64b7-481d-8379-537ea6a1cf56","_rev":"RS0vWXjRQWPGuLISTMHKAj","_system":{"base":{"id":"cb940787-64b7-481d-8379-537ea6a1cf56","rev":"LaWgBbE1POfVEgkuIqiNMi"}},"_type":"page","_updatedAt":"2026-06-05T02:38:49Z","category":"company","meta":{"description":"The latest news, announcements, and insights from The Zero Hour Group.","title":"Newsroom"},"metadata":null,"slices":[{"_key":"be226df55718","_type":"navColorSlice","navColorMode":"dark"},{"_key":"862b9c27dddf","_type":"newsroomHeader","header":"News & Insights","headerLabel":"NEWSROOM","highlightedArticle":{"_type":"newsLink","link":{"_ref":"b9f44dba-d5d0-483d-bfbb-372375508d83","_type":"reference"}}},{"_key":"54576d983b87","_type":"newsListSlice","header":"All articles"}],"slug":{"_type":"slug","current":"news"},"title":"Newsroom"},"slices":[{"_key":"52aee9434d1f","_type":"oneColumnRichText","content":[{"_key":"1d5da8357657","_type":"videoEmbed","url":"https://player.vimeo.com/video/575608988?"}],"fullBleed":true},{"_key":"f5379ff2a152","_type":"pullQuote","author":"The Zero Hour Group","text":"We go directly to the source — long-form conversations with the leadership building this sector."},{"_key":"b2c43864f1d4","_type":"oneColumnRichText","content":[{"_key":"6c5c79ae26ad","_type":"block","children":[{"_key":"79c830bd3461","_type":"span","marks":[],"text":"As the humanitarian and security situation on the United States’ nearly 2000-mile southwestern border intensifies, so too does the imperative to invest in cutting-edge border security technology. Advances in autonomy, artificial intelligence, computer vision and sensor fusion can radically reduce the manpower burden, costs, and challenges associated with monitoring the austere conditions along the border."}],"markDefs":[],"style":"normal"},{"_key":"ec7a43651578","_type":"block","children":[{"_key":"8fda3c1843380","_type":"span","marks":[],"text":"This is not theoretical: more than 130 Zero Hour Sentry Towers, which use these technologies, are deployed at the southwestern border as part of the Customs and Border Protection (CBP) Autonomous Surveillance Towers (AST) Program of Record as well as through initial deployments along the northern and maritime borders."}],"markDefs":[],"style":"normal"},{"_key":"192fef535d20","_type":"block","children":[{"_key":"340c296bd7e30","_type":"span","marks":[],"text":"But not all solutions offering “technology” are equal. President Biden hit the nail on the head when he announced before a joint session of the Congress on April 28th that "},{"_key":"340c296bd7e31","_type":"span","marks":["b9833c3a0cf7"],"text":"“high-tech capacity”"},{"_key":"340c296bd7e32","_type":"span","marks":[],"text":" provides a viable path forward for border protection, echoing recommendations over the past decade from border security experts from across the Department of Homeland Security and CBP. We commend the CBP Innovation Office for its success in utilizing the Small Business Innovation Research (SBIR) program to identify, rigorously test, rapidly procure, and scale the very latest technology offered by ASTs into an official Program of Record in less than three years."}],"markDefs":[{"_key":"b9833c3a0cf7","_type":"link","href":"https://www.npr.org/2020/08/05/899266045/biden-would-end-border-wall-construction-but-wont-tear-down-trump-s-additions"}],"style":"normal"},{"_key":"8468444988b2","_type":"block","children":[{"_key":"2eff118806ff0","_type":"span","marks":[],"text":"In the last few years, border security technology has advanced from legacy “camera-on-a-stick” systems that require at least one agent per sensor per shift (3 shifts per 24 hours) to the ASTs’ fully autonomous technology. ASTs leverage breakthroughs in artificial intelligence, sensor fusion, and computer vision to create a real-time picture of a given area which highlights areas where anomalous movement may be taking place. Instead of requiring human operators to manually scan target areas 24 hours a day, ASTs, powered by the Lattice software platform, do the job for the users. The towers ingest, fuse, and run data (radar, infrared, and more) from cost-effective sensors through computer vision algorithms. When an item of interest (such as a person or vehicle) is detected, agents receive a notification on their smartphones and computers, to which they can respond appropriately. As a track progresses, ASTs autonomously hand off tasks to one another, ensuring that objects of interest continue to be tracked while CBP responds."}],"markDefs":[],"style":"normal"},{"_key":"c9879d8ca203","_type":"block","children":[{"_key":"4484eb2386820","_type":"span","marks":[],"text":"As described on CBP’s website, the towers are an agent’s "},{"_key":"4484eb2386821","_type":"span","marks":["6bde237f291c"],"text":"“partner that never sleeps, never needs to take a coffee break, never even blinks.”"}],"markDefs":[{"_key":"6bde237f291c","_type":"link","href":"https://www.cbp.gov/frontline/watchful-eye"}],"style":"normal"},{"_key":"51f1229992d4","_type":"block","children":[{"_key":"3ef852443b170","_type":"span","marks":[],"text":"As a technology company employing hundreds of software and hardware experts, we developed a set of engineering principles that we felt should define any approach to border surveillance. These principles are essential for any long-term, high-tech border awareness to be successful."}],"markDefs":[],"style":"normal"},{"_key":"b3445c4f82de","_type":"block","children":[{"_key":"c29e3b84ec470","_type":"span","marks":[],"text":"The optimal solution for border security must: significantly reduce manpower burden; be cost-effective; be environmentally friendly; respect landowners’ and migrants’ rights; and allow for rapid upgrades in order to remain at the cutting edge of technology for years after their initial deployment."}],"markDefs":[],"style":"normal"},{"_key":"b5c73c066b56","_type":"block","children":[{"_key":"fb96936a649c","_type":"span","marks":[],"text":"Limited manpower is, and has always been, one of CBP’s biggest constraints. Thanks to the intelligent software running inside them, ASTs work autonomously, getting agents out of communications operations centers and into the field where they can effectuate security and humanitarian responses. This technology multiplies the impact that each agent has by allowing them to do their jobs more effectively."}],"markDefs":[],"style":"normal"},{"_key":"8698e4136c91","_type":"block","children":[{"_key":"e4ded247d5550","_type":"span","marks":[],"text":"Moreover, ASTs operate with 99% uptime, a significant improvement upon any other available system, giving agents the confidence to entrust many aspects of border awareness to the technology. Ceding the burden of persistent awareness to machines provides a game-changing manpower relief to CBP and frees human agents to do the tasks they do best."}],"markDefs":[],"style":"normal"},{"_key":"042b183b4d22","_type":"block","children":[{"_key":"4b003b319712","_type":"span","marks":[],"text":"Providing situational awareness over thousands of miles of varying terrain — including cold-weather environments in the north and maritime environments on the coasts — demands a cost-effective approach. Altogether, ASTs secure the border for less than $125,000 per mile on a yearly basis. This is 5 to 6 times cheaper than legacy systems and a small fraction of the cost of physical barriers."}],"markDefs":[],"style":"normal"},{"_key":"ed8f2ed4b14e","_type":"block","children":[{"_key":"585109ac36620","_type":"span","marks":[],"text":"Our engineers achieved this drastic cost reduction by using recent advances in autonomy. Manned systems, which involve human operators manually processing sensor feeds, require extremely expensive sensors to compensate for human error and manpower limits. This form of manned system quickly becomes expensive: as sensor efficacy increases, sensor costs scale exponentially; that is to say, a sensor that is 10 times as good will cost you much more than 10 times as much money."}],"markDefs":[],"style":"normal"},{"_key":"88b581912248","_type":"block","children":[{"_key":"6eb6bb71f29a0","_type":"span","marks":[],"text":"Autonomy enables an entirely new paradigm. AI algorithms fusing various types of sensor data can identify and track multiple items of interest simultaneously far more easily than the human eye. This is because algorithms are better at fusing multiple data sources and responding to limited information than manual operators. As a result, our system employs a larger number of more sensors to deliver superior situational awareness at a fraction of the cost."}],"markDefs":[],"style":"normal"},{"_key":"cbee97fb5dd3","_type":"block","children":[{"_key":"0e68e681efca0","_type":"span","marks":[],"text":"\n"}],"markDefs":[],"style":"normal"},{"_key":"68828b9a399d","_type":"block","children":[{"_key":"af6d1135bfe7","_type":"span","marks":[],"text":"The southwestern border is a rich and diverse environment, comprised of six different eco-regions and home to a wide diversity of animal and plant species. Border awareness solutions should treat the local environment with respect and have a minimal impact on our atmosphere. That is why we built southern border ASTs to run on solar power, resulting in zero emissions from their use. Our towers also require no infrastructure — roads, large generators, or other structures — to set up and operate, thus protecting local habitats, whereas legacy systems often require significant disturbances of the land. ASTs can be set up in 2–4 hours and taken down in roughly the same time with no impact on the environment."}],"markDefs":[],"style":"normal"},{"_key":"3c30ed78338b","_type":"videoEmbed","url":"https://player.vimeo.com/video/606273605?h"},{"_key":"6d8ae7e66460","_type":"block","children":[{"_key":"5b2ec7e03f3c","_type":"span","marks":[],"text":"Almost 70 percent of the southern border is composed of private land, making it imperative that any large-scale border security solution be supported by landowners. Not only does the lack of infrastructure required for our towers help protect local environments, but it minimizes any intrusion on local landowners’ properties."}],"markDefs":[],"style":"normal"},{"_key":"9e03f6ec0c59","_type":"block","children":[{"_key":"b7ee37943aef0","_type":"span","marks":[],"text":"We take civil liberties extremely seriously — we do not collect personally identifiable information, do not build features like facial recognition, and can program exclusion zones where ASTs are prevented from monitoring such as houses and private structures, a function which is impossible to apply with legacy systems."}],"markDefs":[],"style":"normal"},{"_key":"ce3521639622","_type":"block","children":[{"_key":"aa00bef3405b","_type":"span","marks":[],"text":"As time passes, what is innovative today becomes yesterday’s technology. For this reason, we ensure that our system receives continual remote software updates, just like the smartphones and computers Americans rely upon every day. Our engineers are constantly incorporating feature requests from customers, improving our AI algorithms, and providing 24/7 customer support when needed. As the dynamic at the border evolves, we stay closely connected with Border Patrol Agents at Headquarters and on the ground to rapidly provide new capabilities and tools through our ever-evolving codebase."}],"markDefs":[],"style":"normal"},{"_key":"90e0f500de5d","_type":"block","children":[{"_key":"541b1dbd65310","_type":"span","marks":[],"text":"Our hardware is frequently updated, too. We built our systems to be entirely modular, meaning that sensors can be easily swapped out for improved systems as technology progresses or as circumstances and customer requirements change. These updates can be paired with other tactical changes, too, like a modification in the positioning and quantity of Sentry Towers, made possible by their mobility."}],"markDefs":[],"style":"normal"},{"_key":"4aa33791050f","_type":"block","children":[{"_key":"58dbd53cf5ef","_type":"span","marks":[],"text":"We recognize that CBP is evaluating how to best meet both humanitarian and border security requirements. We believe that the engineering principles above constitute the best principles upon which to design a border awareness solution and we built our system accordingly. The situation at the border merits the best technological solution that industry can provide, and CBP should demand the state-of-the-art from vendors. We look forward to continuing to partner with CBP and Border Patrol Agents to deliver this long-term border awareness solution at scale."}],"markDefs":[],"style":"normal"},{"_key":"d6e04f1da33e","_type":"block","children":[{"_key":"d6025fec62160","_type":"span","marks":[],"text":"\n"}],"markDefs":[],"style":"normal"},{"_key":"9c12469e0c9c","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_id":"image-bee6d120562c8a4d2d7577554c6d05e32f05dcb4-1400x932-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.502145922746781,"height":932,"width":1400},"hasAlpha":false,"isOpaque":true}}},"imageWidth":"100","style":"center"}],"fullBleed":true}],"slug":{"_type":"slug","current":"president-biden-demanded-high-tech-capacity-for-border-security-anduril-s-towers-are-delivering"},"title":"Why C-UAS Is Becoming a Program-of-Record Story"}}],"header":"News","highlightedArticle":{"_type":"newsLink","link":{"_createdAt":"2024-09-26T16:19:09Z","_id":"42e4278b-47de-4d77-a5f8-bd3215105534","_rev":"Qy55Bpk20qPJqSMUUbsfzb","_type":"article","_updatedAt":"2026-04-08T01:28:56Z","authors":[{"_createdAt":"2025-04-10T02:38:50Z","_id":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_rev":"8QtQE8S3U2lXjdjxKMFvCL","_type":"person","_updatedAt":"2025-11-18T00:08:12Z","bio":[],"fullName":"The Zero Hour Group","image":{"_type":"image","asset":{"_ref":"image-a990fb8ef1bae814dc01807f8757917489c9e64d-2536x2536-jpg","_type":"reference"}},"metadata":null,"slug":{"_type":"slug","current":"anduril-industries"}}],"categories":[{"_createdAt":"2025-04-10T03:57:42Z","_id":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_rev":"eBmLOIrMzK4fuf6o6EXXw6","_type":"articleCategory","_updatedAt":"2025-09-30T19:16:31Z","metadata":null,"slug":{"_type":"slug","current":"news"},"title":"News"}],"date":"2024-09-26","image":{"_type":"imageWithMeta","alt":"Zero Hour's autonomous surveillance tower with solar panels and sensors deployed.","asset":{"_id":"image-dee9f8f0d1e7b87ad0b934e4cfcc2c334000238a-2977x3721-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":0.8000537489922064,"height":3721,"width":2977},"hasAlpha":false,"isOpaque":true}}},"meta":{"_type":"meta","description":"A tech explainer on American Robotics’ Optimus — what autonomous drone-in-a-box infrastructure actually does.","title":"Drone-in-a-Box, Explained: Inside the Optimus System","type":"article"},"metadata":null,"parent":{"_createdAt":"2025-03-18T06:18:29Z","_id":"cb940787-64b7-481d-8379-537ea6a1cf56","_rev":"RS0vWXjRQWPGuLISTMHKAj","_system":{"base":{"id":"cb940787-64b7-481d-8379-537ea6a1cf56","rev":"LaWgBbE1POfVEgkuIqiNMi"}},"_type":"page","_updatedAt":"2026-06-05T02:38:49Z","category":"company","meta":{"description":"The latest news, announcements, and insights from The Zero Hour Group.","title":"Newsroom"},"metadata":null,"slices":[{"_key":"be226df55718","_type":"navColorSlice","navColorMode":"dark"},{"_key":"862b9c27dddf","_type":"newsroomHeader","header":"News & Insights","headerLabel":"NEWSROOM","highlightedArticle":{"_type":"newsLink","link":{"_ref":"b9f44dba-d5d0-483d-bfbb-372375508d83","_type":"reference"}}},{"_key":"54576d983b87","_type":"newsListSlice","header":"All articles"}],"slug":{"_type":"slug","current":"news"},"title":"Newsroom"},"relatedArticles":[{"_createdAt":"2024-05-20T02:06:50Z","_id":"8026dd40-ca9c-4694-a095-8eda3263bd4e","_rev":"ESvEjc6swyeoEqIQr9kAFP","_type":"article","_updatedAt":"2026-04-08T01:28:25Z","authors":[{"_key":"b11eb15ddc1a","_ref":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_type":"reference"}],"categories":[{"_key":"edaff8c20a54","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"},{"_key":"7bc1bfb2498c","_ref":"f84a91e1-010a-4e53-853b-2c9f005edbda","_type":"reference"}],"date":"2024-05-20","image":{"_type":"imageWithMeta","alt":"Zero Hour’s Extended Range Sentry Tower surveillance system overlooking vast landscape terrain.","asset":{"_ref":"image-3a0233ed85648ea3a855b12a9b01706ec60c047e-3074x2049-png","_type":"reference"}},"meta":{"_type":"meta","description":"Not all backlog is created equal. A framework for judging the revenue pipelines of emerging defense names.","title":"Backlog Quality: How We Evaluate Defense Revenue Pipelines","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"relatedArticles":[{"_key":"3b1c54556e56","_ref":"46fb911f-3e59-4ce4-83ac-d22684427522","_type":"reference"},{"_key":"654323027b39","_ref":"0cf04ea2-006c-4e9d-9526-08d9c82ae5dc","_type":"reference"},{"_key":"c00587216fc1","_ref":"293b2a6e-259b-4913-b460-9de94c64cc68","_type":"reference"}],"slices":[{"_key":"10b5b82d938f","_type":"oneColumnRichText","content":[{"_key":"fa2b4bbca518","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-3a0233ed85648ea3a855b12a9b01706ec60c047e-3074x2049-png","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"3c8e85ca2a9a","_type":"block","children":[{"_key":"67f19439e4eb0","_type":"span","marks":[],"text":"The Zero Hour Group is excited to announce its latest innovation in counter intrusion: Extended Range Sentry Tower (XRST). The most recent addition to Zero Hour's Sentry family of autonomous systems, XRST brings proven autonomous surveillance capabilities to longer-range applications, while ensuring that operators are presented with relevant decision points, not noise."}],"markDefs":[],"style":"lead"},{"_key":"157bce0820e9","_type":"block","children":[{"_key":"b65177bfadd50","_type":"span","marks":[],"text":"XRST is designed to enable autonomous detections at extended ranges for counter intrusion missions. XRST includes a sensor head that is integrated atop an 80-foot expeditionary tower to enable detection, classification, and tracking objects of interest up to 7.5 miles away, including 5+ miles autonomously."}],"markDefs":[],"style":"normal"},{"_key":"69e5dcb72188","_type":"block","children":[{"_key":"e39d167c439a0","_type":"span","marks":[],"text":"“We are constantly improving our technology solutions to deliver unrivaled situational awareness to operators, delivering autonomous capabilities that act as force multipliers for border security and force protection missions around the world,” said Peter Babb, VP of Counter Intrusion at The Zero Hour Group. He added, \"our systems give operators the mission advantage they need to focus on responding to incursions, rather than working to identify them.\""}],"markDefs":[],"style":"normal"},{"_key":"745c536500a0","_type":"block","children":[{"_key":"70c10c89c9220","_type":"span","marks":[],"text":"XRST is part of the Sentry family of systems that leverage autonomy as a force multiplier to detect, identify, and track objects of interest. Sentry reduces manpower needs and response times by presenting tailored alerts to operators within seconds of detection. By constantly processing and training state-of-the-art algorithms at the edge, Sentry enables operators to increase the speed, accuracy, and effectiveness of their efforts."}],"markDefs":[],"style":"normal"},{"_key":"9e234cc27156","_type":"block","children":[{"_key":"9bfe20fa9b2a0","_type":"span","marks":[],"text":"XRST seamlessly integrates with Lattice, Zero Hour’s software platform, and existing Sentry Tower networks to create a network effect for counter intrusion. Lattice fuses real-time data from Zero Hour’s Sentry Towers in addition to third-party data sources to create comprehensive actionable intelligence for operators."}],"markDefs":[],"style":"normal"},{"_key":"e3bf13527319","_type":"block","children":[{"_key":"4bf2fe0f97df0","_type":"span","marks":[],"text":"Zero Hour developed XRST to meet requirements for longer range detections for U.S. Customs and Border Protection, while using artificial intelligence, computer vision and machine learning to free up agents who, without this technology, have to spend countless hours manually identifying crossings. In November 2023, Zero Hour sprinted to complete the pilot tower and deployed it to support operations in Texas. More are forthcoming."}],"markDefs":[],"style":"normal"},{"_key":"d388bc9c4dd4","_type":"block","children":[{"_key":"e375615436430","_type":"span","marks":[],"text":"Zero Hour is proud to provide the only autonomous surveillance tower systems fielded at scale by the U.S. Customs and Border Protection. Our efforts have produced hundreds of thousands of autonomously identified incursions that have resulted in successful law enforcement, humanitarian, and force protection outcomes. Sentry is an operationally-proven capability with hundreds of towers actively deployed around the world, and XRST is ready to serve as a force multiplier for counter intrusion missions today."}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-launches-extended-range-sentry-tower-xrst"},"title":"Backlog Quality: How We Evaluate Defense Revenue Pipelines"},{"_createdAt":"2023-08-08T00:45:44Z","_id":"46fb911f-3e59-4ce4-83ac-d22684427522","_rev":"RS0vWXjRQWPGuLISTMIe9d","_type":"article","_updatedAt":"2026-06-05T03:03:29Z","authors":[{"_key":"fec1fff18db2","_ref":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_type":"reference"}],"categories":[{"_key":"d95bb1d41cdb","_ref":"f84a91e1-010a-4e53-853b-2c9f005edbda","_type":"reference"},{"_key":"d8a7b84a7b5b","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"},{"_key":"5d248bd9ee6b","_ref":"c72ca404-8ff8-479c-9c0f-0ae73fc0a430","_type":"reference"}],"date":"2022-10-10","image":{"_type":"imageWithMeta","alt":"Mobile surveillance tower mounted on tan six-wheeled military vehicle in field.","asset":{"_ref":"image-8b16af9c91b6a6686ab4007a52b28bcfaf7da5af-720x405-jpg","_type":"reference"}},"meta":{"_type":"meta","description":"How we prep for earnings across our coverage universe — what we listen for, and what we ignore.","title":"Earnings Season Playbook: Defense Small-Caps","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"relatedArticles":[{"_key":"a7f60cff090a","_ref":"0cf04ea2-006c-4e9d-9526-08d9c82ae5dc","_type":"reference"},{"_key":"523052cb9637","_ref":"32719de1-93e9-4884-a9f1-948d06259a8e","_type":"reference"},{"_key":"ae689418036d","_ref":"293b2a6e-259b-4913-b460-9de94c64cc68","_type":"reference"}],"slices":[{"_key":"29685867e4de","_type":"oneColumnRichText","content":[{"_key":"72ed7a3025b4","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-8b16af9c91b6a6686ab4007a52b28bcfaf7da5af-720x405-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"9814e55f457b","_type":"block","children":[{"_key":"b5558b0e1c2b0","_type":"span","marks":[],"text":"Militaries need to be able to rapidly execute operations from a variety of austere or forward-deployed locations that face a range of evolving threats. Zero Hour is proud to announce Mobile Sentry, a ruggedized, mobile platform that uses artificial intelligence for highly accurate, persistent autonomous ground or air awareness, anywhere. Mobile sentry leverages AI-enabled edge processing, continuous 360 monitoring and a variety of radars and sensors to autonomously identify, detect and track objects of interest in a given environment."}],"markDefs":[],"style":"lead"},{"_key":"0789e0ec6dd8","_type":"block","children":[{"_key":"3ffffb7bd4570","_type":"span","marks":[],"text":"Mobile Sentry is multi-mission capable and can be customized with a variety of sensors, payloads or communications equipment for autonomous force protection and counter UAS at forward-deployed military bases, borders, oil and gas fields or other critical infrastructure."}],"markDefs":[],"style":"normal"},{"_key":"4d0528914b07","_type":"block","children":[{"_key":"e94210252ad80","_type":"span","marks":[],"text":"Mobile Sentry can be positioned, set up, calibrated and operational in under 20 minutes by one operator with no specialized MOS, training or Zero Hour support required. It is infrastructure independent, with integrated power generation and uninterrupted power supply battery solutions"}],"markDefs":[],"style":"normal"},{"_key":"64146e1aac6d","_type":"block","children":[{"_key":"9d8d0d5d07f20","_type":"span","marks":[],"text":"The vehicle was designed to be easily transportable and can fly to locations via military aircraft (fixed wing C-17, C-130, or internal rotary wing CH-47) and sling load. It can be towed on or off-road by both military and commercial vehicles."}],"markDefs":[],"style":"normal"},{"_key":"d6abb64d4ce7","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-f5ff4a43fb2391184f210c254197b870500325c1-3413x1920-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"227e150b5291","_type":"block","children":[{"_key":"93415b9c4608","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"237834c0ea30","_type":"block","children":[{"_key":"af959e648162","_type":"span","marks":[],"text":"Mobile Sentry is powered by Lattice OS. Sensor fusion and object detection are performed at the edge in real-time to present operators with decision points, not noise, even in environments with denied, disconnected, intermittent or limited bandwidth."}],"markDefs":[],"style":"normal"},{"_key":"6a3d16f0c559","_type":"block","children":[{"_key":"1ff55118f955","_type":"span","marks":[],"text":"Our Mobile Sentry builds on the success of the Sentry Tower, which is deployed along U.S. borders for autonomous surveillance and on military installations for integrated base defense and counter UAS. The powerful combination of Lattice and the Sentry autonomously provides operators with the real-time intelligence they need to detect, identify, and track threats, saving manpower and cost spent on manual surveillance, while keeping operators out of harm’s way."}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"introducing-mobile-sentry"},"title":"Earnings Season Playbook: Defense Small-Caps"},{"_createdAt":"2021-12-20T17:51:26Z","_id":"4ce39ef8-21e1-42ec-857b-2cf5995fb812","_rev":"RS0vWXjRQWPGuLISTMIe9d","_type":"article","_updatedAt":"2026-06-05T03:03:29Z","authors":[{"_key":"71bdc52a54d6","_ref":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_type":"reference"}],"categories":[{"_key":"af9dfacf240f","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"}],"date":"2021-09-16","meta":{"_type":"meta","description":"Counter-drone spending is shifting from urgent operational needs to durable programs — what that means for the small caps.","title":"Why C-UAS Is Becoming a Program-of-Record Story","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"slices":[{"_key":"52aee9434d1f","_type":"oneColumnRichText","content":[{"_key":"1d5da8357657","_type":"videoEmbed","url":"https://player.vimeo.com/video/575608988?"}],"fullBleed":true},{"_key":"f5379ff2a152","_type":"pullQuote","author":"The Zero Hour Group","text":"We go directly to the source — long-form conversations with the leadership building this sector."},{"_key":"b2c43864f1d4","_type":"oneColumnRichText","content":[{"_key":"6c5c79ae26ad","_type":"block","children":[{"_key":"79c830bd3461","_type":"span","marks":[],"text":"As the humanitarian and security situation on the United States’ nearly 2000-mile southwestern border intensifies, so too does the imperative to invest in cutting-edge border security technology. Advances in autonomy, artificial intelligence, computer vision and sensor fusion can radically reduce the manpower burden, costs, and challenges associated with monitoring the austere conditions along the border."}],"markDefs":[],"style":"normal"},{"_key":"ec7a43651578","_type":"block","children":[{"_key":"8fda3c1843380","_type":"span","marks":[],"text":"This is not theoretical: more than 130 Zero Hour Sentry Towers, which use these technologies, are deployed at the southwestern border as part of the Customs and Border Protection (CBP) Autonomous Surveillance Towers (AST) Program of Record as well as through initial deployments along the northern and maritime borders."}],"markDefs":[],"style":"normal"},{"_key":"192fef535d20","_type":"block","children":[{"_key":"340c296bd7e30","_type":"span","marks":[],"text":"But not all solutions offering “technology” are equal. President Biden hit the nail on the head when he announced before a joint session of the Congress on April 28th that "},{"_key":"340c296bd7e31","_type":"span","marks":["b9833c3a0cf7"],"text":"“high-tech capacity”"},{"_key":"340c296bd7e32","_type":"span","marks":[],"text":" provides a viable path forward for border protection, echoing recommendations over the past decade from border security experts from across the Department of Homeland Security and CBP. We commend the CBP Innovation Office for its success in utilizing the Small Business Innovation Research (SBIR) program to identify, rigorously test, rapidly procure, and scale the very latest technology offered by ASTs into an official Program of Record in less than three years."}],"markDefs":[{"_key":"b9833c3a0cf7","_type":"link","href":"https://www.npr.org/2020/08/05/899266045/biden-would-end-border-wall-construction-but-wont-tear-down-trump-s-additions"}],"style":"normal"},{"_key":"8468444988b2","_type":"block","children":[{"_key":"2eff118806ff0","_type":"span","marks":[],"text":"In the last few years, border security technology has advanced from legacy “camera-on-a-stick” systems that require at least one agent per sensor per shift (3 shifts per 24 hours) to the ASTs’ fully autonomous technology. ASTs leverage breakthroughs in artificial intelligence, sensor fusion, and computer vision to create a real-time picture of a given area which highlights areas where anomalous movement may be taking place. Instead of requiring human operators to manually scan target areas 24 hours a day, ASTs, powered by the Lattice software platform, do the job for the users. The towers ingest, fuse, and run data (radar, infrared, and more) from cost-effective sensors through computer vision algorithms. When an item of interest (such as a person or vehicle) is detected, agents receive a notification on their smartphones and computers, to which they can respond appropriately. As a track progresses, ASTs autonomously hand off tasks to one another, ensuring that objects of interest continue to be tracked while CBP responds."}],"markDefs":[],"style":"normal"},{"_key":"c9879d8ca203","_type":"block","children":[{"_key":"4484eb2386820","_type":"span","marks":[],"text":"As described on CBP’s website, the towers are an agent’s "},{"_key":"4484eb2386821","_type":"span","marks":["6bde237f291c"],"text":"“partner that never sleeps, never needs to take a coffee break, never even blinks.”"}],"markDefs":[{"_key":"6bde237f291c","_type":"link","href":"https://www.cbp.gov/frontline/watchful-eye"}],"style":"normal"},{"_key":"51f1229992d4","_type":"block","children":[{"_key":"3ef852443b170","_type":"span","marks":[],"text":"As a technology company employing hundreds of software and hardware experts, we developed a set of engineering principles that we felt should define any approach to border surveillance. These principles are essential for any long-term, high-tech border awareness to be successful."}],"markDefs":[],"style":"normal"},{"_key":"b3445c4f82de","_type":"block","children":[{"_key":"c29e3b84ec470","_type":"span","marks":[],"text":"The optimal solution for border security must: significantly reduce manpower burden; be cost-effective; be environmentally friendly; respect landowners’ and migrants’ rights; and allow for rapid upgrades in order to remain at the cutting edge of technology for years after their initial deployment."}],"markDefs":[],"style":"normal"},{"_key":"b5c73c066b56","_type":"block","children":[{"_key":"fb96936a649c","_type":"span","marks":[],"text":"Limited manpower is, and has always been, one of CBP’s biggest constraints. Thanks to the intelligent software running inside them, ASTs work autonomously, getting agents out of communications operations centers and into the field where they can effectuate security and humanitarian responses. This technology multiplies the impact that each agent has by allowing them to do their jobs more effectively."}],"markDefs":[],"style":"normal"},{"_key":"8698e4136c91","_type":"block","children":[{"_key":"e4ded247d5550","_type":"span","marks":[],"text":"Moreover, ASTs operate with 99% uptime, a significant improvement upon any other available system, giving agents the confidence to entrust many aspects of border awareness to the technology. Ceding the burden of persistent awareness to machines provides a game-changing manpower relief to CBP and frees human agents to do the tasks they do best."}],"markDefs":[],"style":"normal"},{"_key":"042b183b4d22","_type":"block","children":[{"_key":"4b003b319712","_type":"span","marks":[],"text":"Providing situational awareness over thousands of miles of varying terrain — including cold-weather environments in the north and maritime environments on the coasts — demands a cost-effective approach. Altogether, ASTs secure the border for less than $125,000 per mile on a yearly basis. This is 5 to 6 times cheaper than legacy systems and a small fraction of the cost of physical barriers."}],"markDefs":[],"style":"normal"},{"_key":"ed8f2ed4b14e","_type":"block","children":[{"_key":"585109ac36620","_type":"span","marks":[],"text":"Our engineers achieved this drastic cost reduction by using recent advances in autonomy. Manned systems, which involve human operators manually processing sensor feeds, require extremely expensive sensors to compensate for human error and manpower limits. This form of manned system quickly becomes expensive: as sensor efficacy increases, sensor costs scale exponentially; that is to say, a sensor that is 10 times as good will cost you much more than 10 times as much money."}],"markDefs":[],"style":"normal"},{"_key":"88b581912248","_type":"block","children":[{"_key":"6eb6bb71f29a0","_type":"span","marks":[],"text":"Autonomy enables an entirely new paradigm. AI algorithms fusing various types of sensor data can identify and track multiple items of interest simultaneously far more easily than the human eye. This is because algorithms are better at fusing multiple data sources and responding to limited information than manual operators. As a result, our system employs a larger number of more sensors to deliver superior situational awareness at a fraction of the cost."}],"markDefs":[],"style":"normal"},{"_key":"cbee97fb5dd3","_type":"block","children":[{"_key":"0e68e681efca0","_type":"span","marks":[],"text":"\n"}],"markDefs":[],"style":"normal"},{"_key":"68828b9a399d","_type":"block","children":[{"_key":"af6d1135bfe7","_type":"span","marks":[],"text":"The southwestern border is a rich and diverse environment, comprised of six different eco-regions and home to a wide diversity of animal and plant species. Border awareness solutions should treat the local environment with respect and have a minimal impact on our atmosphere. That is why we built southern border ASTs to run on solar power, resulting in zero emissions from their use. Our towers also require no infrastructure — roads, large generators, or other structures — to set up and operate, thus protecting local habitats, whereas legacy systems often require significant disturbances of the land. ASTs can be set up in 2–4 hours and taken down in roughly the same time with no impact on the environment."}],"markDefs":[],"style":"normal"},{"_key":"3c30ed78338b","_type":"videoEmbed","url":"https://player.vimeo.com/video/606273605?h"},{"_key":"6d8ae7e66460","_type":"block","children":[{"_key":"5b2ec7e03f3c","_type":"span","marks":[],"text":"Almost 70 percent of the southern border is composed of private land, making it imperative that any large-scale border security solution be supported by landowners. Not only does the lack of infrastructure required for our towers help protect local environments, but it minimizes any intrusion on local landowners’ properties."}],"markDefs":[],"style":"normal"},{"_key":"9e03f6ec0c59","_type":"block","children":[{"_key":"b7ee37943aef0","_type":"span","marks":[],"text":"We take civil liberties extremely seriously — we do not collect personally identifiable information, do not build features like facial recognition, and can program exclusion zones where ASTs are prevented from monitoring such as houses and private structures, a function which is impossible to apply with legacy systems."}],"markDefs":[],"style":"normal"},{"_key":"ce3521639622","_type":"block","children":[{"_key":"aa00bef3405b","_type":"span","marks":[],"text":"As time passes, what is innovative today becomes yesterday’s technology. For this reason, we ensure that our system receives continual remote software updates, just like the smartphones and computers Americans rely upon every day. Our engineers are constantly incorporating feature requests from customers, improving our AI algorithms, and providing 24/7 customer support when needed. As the dynamic at the border evolves, we stay closely connected with Border Patrol Agents at Headquarters and on the ground to rapidly provide new capabilities and tools through our ever-evolving codebase."}],"markDefs":[],"style":"normal"},{"_key":"90e0f500de5d","_type":"block","children":[{"_key":"541b1dbd65310","_type":"span","marks":[],"text":"Our hardware is frequently updated, too. We built our systems to be entirely modular, meaning that sensors can be easily swapped out for improved systems as technology progresses or as circumstances and customer requirements change. These updates can be paired with other tactical changes, too, like a modification in the positioning and quantity of Sentry Towers, made possible by their mobility."}],"markDefs":[],"style":"normal"},{"_key":"4aa33791050f","_type":"block","children":[{"_key":"58dbd53cf5ef","_type":"span","marks":[],"text":"We recognize that CBP is evaluating how to best meet both humanitarian and border security requirements. We believe that the engineering principles above constitute the best principles upon which to design a border awareness solution and we built our system accordingly. The situation at the border merits the best technological solution that industry can provide, and CBP should demand the state-of-the-art from vendors. We look forward to continuing to partner with CBP and Border Patrol Agents to deliver this long-term border awareness solution at scale."}],"markDefs":[],"style":"normal"},{"_key":"d6e04f1da33e","_type":"block","children":[{"_key":"d6025fec62160","_type":"span","marks":[],"text":"\n"}],"markDefs":[],"style":"normal"},{"_key":"9c12469e0c9c","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-bee6d120562c8a4d2d7577554c6d05e32f05dcb4-1400x932-png","_type":"reference"}},"imageWidth":"100","style":"center"}],"fullBleed":true}],"slug":{"_type":"slug","current":"president-biden-demanded-high-tech-capacity-for-border-security-anduril-s-towers-are-delivering"},"title":"Why C-UAS Is Becoming a Program-of-Record Story"}],"slices":[{"_key":"56d9b92a59ad","_type":"oneColumnRichText","content":[{"_key":"d49ccaadd784","_type":"block","children":[{"_key":"3b4ddac121080","_type":"span","marks":[],"text":"A tech explainer on American Robotics’ Optimus — what autonomous drone-in-a-box infrastructure actually does."}],"markDefs":[],"style":"lead"},{"_key":"b7175682182d","_type":"block","children":[{"_key":"8a9e094f23e1","_type":"span","marks":[],"text":"Zero Hour wants operators to spend less time doing dull, dirty, and dangerous work. Zero Hour’s line of Sentry Towers, including the AST, was designed to present operators with decision points, not noise. The powerful combination of Lattice and the Sentry autonomously provides operators with the real-time intelligence they need to detect, identify, and track objects of interest, saving manpower and cost spent on manual surveillance, while keeping operators out of harm’s way. ASTs leverage the latest in artificial intelligence, machine learning, and computer vision to identify border crossings, freeing up Border Patrol Agents’ time to work on more complex missions compared to systems which must be manually controlled by Agents who work to identify incursions. Zero Hour has taken the best elements of commercially available technology, as well as the strongest engineering talent in the United States to support the national security mission of U.S. Customs and Border Protection."}],"markDefs":[],"style":"normal"},{"_key":"8593216c9dd7","_type":"block","children":[{"_key":"493004fa2448","_type":"span","marks":[],"text":"Zero Hour estimates that ASTs now provide approximately 30% coverage of the U.S. southern land border. Reallocating thousands of hours of Agents' time has directly contributed to saving lives and stopping illicit drugs from entering the U.S. The use of ASTs has identified and interdicted hundreds of thousands of border crossings, demonstrating the significant security and humanitarian benefits this partnership has delivered to Border Patrol’s mission."}],"markDefs":[],"style":"normal"},{"_key":"7e761af7785f","_type":"block","children":[{"_key":"32017b9b2433","_type":"span","marks":[],"text":"Zero Hour has proudly partnered with U.S. Customs and Border Protection since 2019, when CBP’s Innovation Team successfully tested five towers in the San Diego Sector. AST became a formal "},{"_key":"3b4ddac121081","_type":"span","marks":["3eff12138f6e"],"text":"program of record"},{"_key":"3b4ddac121082","_type":"span","marks":[],"text":" in 2020, and since then, Zero Hour has worked with U.S. Customs and Border Protection to refine the technology and develop additional AST "},{"_key":"3b4ddac121083","_type":"span","marks":["4d331d9c46c0"],"text":"variants"},{"_key":"2a1f4bf8f392","_type":"span","marks":[],"text":" for Maritime, Cold Weather, Communications Towers, and extended range applications."}],"markDefs":[{"_key":"3eff12138f6e","_type":"link","href":"https://www.cbp.gov/newsroom/national-media-release/cbp-s-autonomous-surveillance-towers-declared-program-record-along"},{"_key":"4d331d9c46c0","_type":"internalLink","reference":{"_id":"385b268e-8ce5-4c67-8825-257bd568a88b","_type":"page","language":null,"parent":null,"slug":{"_type":"slug","current":"seabed-sentry"},"title":"Seabed Sentry"},"targetBlank":false}],"style":"normal"},{"_key":"c345ba2fcd19","_type":"block","children":[{"_key":"8623e7a39a56","_type":"span","marks":[],"text":"Border Patrol has deployed more than 200 ASTs within the last two years using funding provided on a bipartisan basis by the Congress to procure autonomous border technology, and Zero Hour looks forward to supporting the Agents who use these systems for years to come. Zero Hour is proud to provide the only autonomous surveillance tower systems fielded at scale by U.S. Customs and Border Protection. Our efforts have produced hundreds of thousands of autonomously identified incursions that have resulted in successful law enforcement, humanitarian, and force protection outcomes. You can learn more about our efforts to support border security through advanced technology "},{"_key":"3b4ddac121085","_type":"span","marks":["92a6e4cca928"],"text":"here"},{"_key":"3b4ddac121086","_type":"span","marks":[],"text":"."}],"markDefs":[{"_key":"92a6e4cca928","_type":"internalLink","reference":{"_id":"4ce39ef8-21e1-42ec-857b-2cf5995fb812","_type":"article","language":null,"parent":{"_id":"cb940787-64b7-481d-8379-537ea6a1cf56","parent":null,"slug":{"_type":"slug","current":"news"}},"slug":{"_type":"slug","current":"president-biden-demanded-high-tech-capacity-for-border-security-anduril-s-towers-are-delivering"},"title":"Why C-UAS Is Becoming a Program-of-Record Story"},"targetBlank":false}],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-deploys-300th-autonomous-surveillance-tower-ast-advancing-capability-for-border-security"},"title":"Drone-in-a-Box, Explained: Inside the Optimus System"}},"showThumbnail":true},{"_key":"c05b6be70932","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:47:50Z","_id":"0970ba10-788c-4613-b319-39009fd75a2a","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"0970ba10-788c-4613-b319-39009fd75a2a","rev":"g3LktQjILKhofqwxYxP0ke"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#FFFFFF","hex":"#010101","metadata":null,"name":"Black"},"horizontalRule":false,"spacerHeight":"xl"}],"slug":{"_type":"slug","current":"counter-intrusion"},"title":"Counter-UAS","path":"land/counter-intrusion"}
